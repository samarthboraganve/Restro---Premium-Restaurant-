# ==========================================================
# RESTRO APPLICATION CONFIGURATION
# ==========================================================
spring.application.name=restro-backend
server.port=8085

# ==========================================================
# MySQL Database Configuration
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/restro_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Samarth@30
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=RestroHikariPool

# ==========================================================
# JPA / Hibernate Configuration
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==========================================================
# Logging
# ==========================================================
logging.level.com.restro=INFO
logging.level.org.springframework.web=INFO
